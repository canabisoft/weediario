# Atualizações automáticas: dependências do backend e do frontend, imagens Docker (digests fixados) e as actions
# (SHAs fixados). Semanal e agrupado, para não virar uma enxurrada de PRs. O cooldown espera alguns dias depois de uma
# versão sair: pacotes sequestrados costumam ser descobertos e retirados nesse intervalo.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      frontend:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
