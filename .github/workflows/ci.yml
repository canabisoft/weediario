# Build e testes do backend e do frontend em todo push na main e em todo pull request.
# Actions fixadas por SHA (o comentário diz a versão): uma tag pode ser movida para um commit malicioso, um SHA não.
# O Dependabot atualiza os SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes + FindSecBugs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = testes (com o Postgres embarcado e os mesmos papéis do banco da produção) + SpotBugs/FindSecBugs.
      - run: mvn -B verify

  frontend:
    name: Frontend (testes, build e audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      # Só dependências que vão para o navegador; vulnerabilidade alta ou crítica para o build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
