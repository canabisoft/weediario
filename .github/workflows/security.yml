# Verificações de segurança: segredos no histórico, análise estática, dependências com vulnerabilidade conhecida e
# imagens Docker. Roda em push, pull request e toda segunda-feira (CVEs novas aparecem sem mudança de código).
# Actions fixadas por SHA (o comentário diz a versão); o Dependabot atualiza.
name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Em pull request a action lista os commits do PR pela API; sem pull-requests: read ela falha com 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Conta pessoal: sem GITLEAKS_LICENSE. A varredura roda inteira no runner; nada do código sai do GitHub.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  analise-estatica:
    name: Análise estática (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep==1.179.0
      # Só severidade ERROR para o build (os avisos aparecem no log). Sem métricas para a Semgrep.
      - run: >-
          semgrep scan --metrics=off --error --severity ERROR
          --config p/java --config p/typescript --config p/owasp-top-ten --config p/secrets --config p/dockerfile
          --exclude 'backend/src/test' --exclude '*.spec.ts'

  dependencias:
    name: Dependências com CVE (OSV-Scanner)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      # pom.xml do backend e package-lock.json do frontend.
      scan-args: |-
        -r
        ./

  imagens:
    name: Imagens e Dockerfiles (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configuração dos Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - run: docker build -t weediario-backend:ci backend
      - run: docker build -t weediario-frontend:ci frontend
      # Só vulnerabilidade alta/crítica que já tem correção: o que não tem correção não é acionável no PR.
      - name: Imagem do backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: weediario-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Imagem do frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: weediario-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
