<a
  href="#conteudo"
  class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded-lg focus:bg-surface focus:p-2"
>
  Pular para o conteúdo
</a>

<header
  class="sticky top-0 z-30 flex items-center justify-between border-b border-line bg-canvas/95 px-4 pb-2 pt-[max(0.5rem,env(safe-area-inset-top))] backdrop-blur"
>
  <a routerLink="/" class="text-lg font-bold tracking-tight text-fg">weediário</a>

  <button
    type="button"
    class="inline-flex min-h-11 items-center gap-2 rounded-full border border-line px-3 text-sm font-medium text-fg"
    [attr.aria-pressed]="theme.isNight()"
    (click)="theme.toggleNight()"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    {{ theme.isNight() ? 'Sair do noturno' : 'Modo noturno' }}
  </button>
</header>

@if (!connectivity.online()) {
  <p role="status" class="border-b border-line bg-surface-raised px-4 py-2 text-center text-sm text-fg-muted">
    Sem conexão. As ferramentas continuam funcionando normalmente.
  </p>
}

<main id="conteudo" class="mx-auto w-full max-w-2xl px-4 pb-28 pt-4">
  <router-outlet />
</main>

<nav
  aria-label="Navegação principal"
  class="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-canvas/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"
>
  <ul class="mx-auto flex max-w-2xl">
    @for (item of nav; track item.path) {
      <li class="flex-1">
        <a
          [routerLink]="item.path"
          routerLinkActive="text-accent"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          #link="routerLinkActive"
          [attr.aria-current]="link.isActive ? 'page' : null"
          class="flex min-h-16 flex-col items-center justify-center gap-1 text-xs font-medium text-fg-muted"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-6 fill-none stroke-current stroke-[1.8]">
            <path [attr.d]="item.icon" stroke-linejoin="round" />
          </svg>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
