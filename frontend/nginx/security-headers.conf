# Cabeçalhos de segurança do app. Incluído em cada location porque o nginx descarta os add_header
# herdados quando a location declara os seus.
#
# CSP sem 'unsafe-inline' e sem 'unsafe-eval': o tema é aplicado por theme-init.js e o build desliga o "inline
# critical CSS", que usaria um handler onload inline. O único script inline é o importmap que o Angular gera para a
# verificação de integridade (SRI) dos chunks: scripts/postbuild.mjs acrescenta o hash dele em script-src a cada build.
# Este arquivo é o modelo; o nginx usa a cópia gerada em dist/frontend/nginx/.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; frame-src https://www.youtube-nocookie.com; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
# O Caddy já manda o mesmo valor (e o sobrescreve); fica aqui para o HSTS não sumir se o nginx for para trás de outro
# proxy. O navegador ignora este cabeçalho em resposta HTTP, então não atrapalha o acesso local.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
