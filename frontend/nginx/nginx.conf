# nginx do weediário: serve o app Angular e encaminha /api para o backend na mesma origem.
#
# Privacidade: nenhum log de acesso (nada de IP, URL ou user-agent em disco) e o IP do visitante
# não é repassado ao backend (sem X-Real-IP / X-Forwarded-For).

worker_processes auto;
# Só erros críticos: os níveis mais baixos incluem o IP do cliente em cada linha.
error_log /dev/stderr crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Container com sistema de arquivos somente leitura: arquivos temporários vão para /tmp (tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Upload de fotos: o backend aceita até 12 MB por imagem.
        client_max_body_size 14m;

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # O backend já envia os próprios cabeçalhos de segurança (CSP 'none' etc.).
            proxy_read_timeout 60s;
        }

        # Arquivos com hash no nome nunca mudam: cache longo.
        location ~* ^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Arquivos que precisam ser revalidados a cada visita para as atualizações chegarem.
        location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|theme-init\.js|manifest\.webmanifest)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            # Rotas do Angular (/growers, /ferramentas/vpd...) caem no index.html.
            try_files $uri $uri/ /index.html;
        }
    }
}
