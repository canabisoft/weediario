# nginx do weediário: serve o app Angular e encaminha /api para o backend na mesma origem.
#
# Privacidade: nenhum log de acesso (nada de IP, URL ou user-agent em disco) e o IP do visitante
# não é repassado ao backend (sem X-Real-IP / X-Forwarded-For).

worker_processes auto;
# Só falhas que derrubam o nginx: mensagens de nível "crit" podem trazer o IP de quem fez a requisição.
error_log /dev/stderr emerg;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Container com sistema de arquivos somente leitura: arquivos temporários vão para /tmp (tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Atrás do Caddy (HTTPS) o protocolo original chega em X-Forwarded-Proto; acesso direto usa o do nginx.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Limite por IP nas rotas de entrar/cadastrar/recuperar, só em memória: o IP vira chave de um contador que some
    # sozinho, nunca vai para log nem para o backend. Atrás do Caddy o IP real chega em X-Weediario-Client (o Caddy
    # sobrescreve o que o cliente mandar); acesso direto ao nginx (só no loopback) usa o IP da conexão.
    map $http_x_weediario_client $auth_limit_key {
        default $http_x_weediario_client;
        ""      $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth:5m rate=20r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Upload de fotos: o backend aceita até 12 MB por imagem.
        client_max_body_size 14m;

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # O backend já envia os próprios cabeçalhos de segurança (CSP 'none' etc.).
            proxy_read_timeout 60s;
        }

        # Entrar, cadastrar e recuperar: limite por IP além do limite por conta do backend. O refresh fica de fora (um
        # 429 nele derrubaria a sessão de quem só recarregou a página várias vezes).
        location ~ ^/api/v1/auth/(login|register|recover|password-reset|email/verify) {
            limit_req zone=auth burst=15 nodelay;
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Weediario-Client "";
            proxy_read_timeout 60s;
        }

        # Notificações em tempo real (Server-Sent Events): sem buffer e com a conexão aberta por mais tempo.
        # O backend manda um heartbeat a cada 25 s e fecha o canal quando o token que o abriu expira.
        location = /api/v1/me/notifications/stream {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 1h;
        }

        # Arquivos com hash no nome nunca mudam: cache longo.
        location ~* ^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Arquivos que precisam ser revalidados a cada visita para as atualizações chegarem.
        location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|theme-init\.js|manifest\.webmanifest)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            # Rotas do Angular (/growers, /ferramentas/vpd...) caem no index.html.
            try_files $uri $uri/ /index.html;
        }
    }
}
