services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weediario
      POSTGRES_USER: ${WEEDIARIO_DB_USER}
      POSTGRES_PASSWORD: ${WEEDIARIO_DB_PASSWORD}
    # Exposto só no loopback, para desenvolvimento local.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d weediario"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WEEDIARIO_DB_URL: jdbc:postgresql://postgres:5432/weediario
      WEEDIARIO_DB_USER: ${WEEDIARIO_DB_USER}
      WEEDIARIO_DB_PASSWORD: ${WEEDIARIO_DB_PASSWORD}
      WEEDIARIO_JWT_SECRET: ${WEEDIARIO_JWT_SECRET}
      WEEDIARIO_PSEUDONYM_KEY: ${WEEDIARIO_PSEUDONYM_KEY}
      WEEDIARIO_CORS_ORIGINS: ${WEEDIARIO_CORS_ORIGINS:-http://localhost:4200}
      WEEDIARIO_MEDIA_PATH: /app/data/images
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - images:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
  images:
