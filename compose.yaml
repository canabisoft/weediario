# Sobe a plataforma inteira: docker compose up -d --build
# Antes da primeira vez, gere o .env com: scripts/setup-env.sh (ou scripts\setup-env.ps1 no PowerShell)
#
# Só o frontend (nginx) é publicado. Backend e banco ficam na rede interna do compose; o nginx
# encaminha /api para o backend, então navegador, cookies e API estão na mesma origem.

name: weediario

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weediario
      POSTGRES_USER: ${WEEDIARIO_DB_USER:?rode scripts/setup-env para criar o .env}
      POSTGRES_PASSWORD: ${WEEDIARIO_DB_PASSWORD:?rode scripts/setup-env para criar o .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d weediario"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *hardening
    build: ./backend
    image: weediario-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WEEDIARIO_DB_URL: jdbc:postgresql://postgres:5432/weediario
      WEEDIARIO_DB_USER: ${WEEDIARIO_DB_USER}
      WEEDIARIO_DB_PASSWORD: ${WEEDIARIO_DB_PASSWORD}
      WEEDIARIO_JWT_SECRET: ${WEEDIARIO_JWT_SECRET:?rode scripts/setup-env para criar o .env}
      WEEDIARIO_PSEUDONYM_KEY: ${WEEDIARIO_PSEUDONYM_KEY:?rode scripts/setup-env para criar o .env}
      # Mesma origem via nginx; a lista só importa para quem acessar a API de outra origem.
      WEEDIARIO_CORS_ORIGINS: http://localhost:${WEEDIARIO_HTTP_PORT:-8080}
      WEEDIARIO_MEDIA_PATH: /app/data/images
    volumes:
      - images:/app/data
    tmpfs:
      - /tmp

  frontend:
    <<: *hardening
    build: ./frontend
    image: weediario-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Só no loopback. Para expor na rede/internet, coloque um proxy com HTTPS na frente (Caddy, Traefik...).
      - "127.0.0.1:${WEEDIARIO_HTTP_PORT:-8080}:8080"
    tmpfs:
      - /tmp

  # HTTPS com certificado automático (Let's Encrypt) na frente do nginx:
  #   WEEDIARIO_DOMAIN=seu.dominio.com docker compose --profile https up -d
  # Com WEEDIARIO_DOMAIN=localhost, usa uma CA local do Caddy para testar na máquina.
  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      WEEDIARIO_DOMAIN: ${WEEDIARIO_DOMAIN:-localhost}
    ports:
      - "${WEEDIARIO_HTTP_PUBLIC_PORT:-80}:80"
      - "${WEEDIARIO_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Banco acessível no host só quando pedido, para rodar o backend fora do Docker (mvn spring-boot:run):
  #   docker compose --profile dev up -d
  postgres-port:
    image: alpine/socat:1.8.0.3
    profiles: ["dev"]
    depends_on:
      postgres:
        condition: service_healthy
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
  images:
  caddy_data:
  caddy_config:
