# Sobe a plataforma inteira: docker compose up -d --build
# Antes da primeira vez, gere o .env com: scripts/setup-env.sh (ou scripts\setup-env.ps1 no PowerShell)
#
# Só o frontend (nginx) é publicado. Backend e banco ficam na rede interna do compose; o nginx
# encaminha /api para o backend, então navegador, cookies e API estão na mesma origem.

name: weediario

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Logs do docker com tamanho máximo: nada acumula para sempre no disco do servidor.
x-logging: &logging
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    # Erros do banco sem DETAIL nem o comando SQL: nada de valor de usuário (apelido, chave duplicada) nos logs.
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: weediario
      POSTGRES_USER: ${WEEDIARIO_DB_USER:?rode scripts/setup-env para criar o .env}
      POSTGRES_PASSWORD: ${WEEDIARIO_DB_PASSWORD:?rode scripts/setup-env para criar o .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d weediario"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Papéis do banco (deploy/postgres/roles.sql): o backend conecta como weediario_app, que só lê e escreve linhas; o
  # Flyway usa weediario_owner; o superusuário fica para manutenção e backup. Roda a cada `up`, antes do backend, e
  # corrige sozinho instalações antigas e bancos restaurados.
  db-roles:
    <<: [*logging, *hardening]
    image: postgres:17-alpine
    restart: "no"
    user: "70:70"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: weediario
      PGUSER: ${WEEDIARIO_DB_USER}
      PGPASSWORD: ${WEEDIARIO_DB_PASSWORD}
      WEEDIARIO_DB_OWNER_PASSWORD: ${WEEDIARIO_DB_OWNER_PASSWORD:?rode scripts/setup-env para acrescentar a senha ao .env}
      WEEDIARIO_DB_APP_PASSWORD: ${WEEDIARIO_DB_APP_PASSWORD:?rode scripts/setup-env para acrescentar a senha ao .env}
    volumes:
      - ./deploy/postgres:/roles:ro
    entrypoint: ["sh", "/roles/roles.sh"]

  backend:
    <<: [*logging, *hardening]
    build: ./backend
    image: weediario-backend:local
    restart: unless-stopped
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      WEEDIARIO_DB_URL: jdbc:postgresql://postgres:5432/weediario
      # Requisições: papel sem DDL e com tempo máximo por comando. Migrations: o dono do schema.
      WEEDIARIO_DB_USER: weediario_app
      WEEDIARIO_DB_PASSWORD: ${WEEDIARIO_DB_APP_PASSWORD}
      SPRING_FLYWAY_USER: weediario_owner
      SPRING_FLYWAY_PASSWORD: ${WEEDIARIO_DB_OWNER_PASSWORD}
      WEEDIARIO_JWT_SECRET: ${WEEDIARIO_JWT_SECRET:?rode scripts/setup-env para criar o .env}
      WEEDIARIO_PSEUDONYM_KEY: ${WEEDIARIO_PSEUDONYM_KEY:?rode scripts/setup-env para criar o .env}
      # Cifra dos textos de saúde do acompanhamento de tratamento (AES-256).
      WEEDIARIO_HEALTH_KEY: ${WEEDIARIO_HEALTH_KEY:?rode scripts/setup-env para acrescentar a chave ao .env}
      WEEDIARIO_HEALTH_PREVIOUS_KEYS: ${WEEDIARIO_HEALTH_PREVIOUS_KEYS:-}
      # Cifra dos e-mails (opcionais) das contas (AES-256).
      WEEDIARIO_EMAIL_KEY: ${WEEDIARIO_EMAIL_KEY:?rode scripts/setup-env para acrescentar a chave ao .env}
      # Dia em que os Termos de Uso entraram no ar (lançamento), ex. 2026-11-01.
      WEEDIARIO_TERMS_PUBLISHED_ON: ${WEEDIARIO_TERMS_PUBLISHED_ON:-}
      # E-mail opcional (confirmação, redefinição de senha, avisos). Sem SMTP, o envio fica desligado.
      WEEDIARIO_PUBLIC_URL: ${WEEDIARIO_PUBLIC_URL:-http://localhost:${WEEDIARIO_HTTP_PORT:-8080}}
      WEEDIARIO_MAIL_FROM: ${WEEDIARIO_MAIL_FROM:-}
      # Só para desenvolvimento: sem SMTP, escreve no log do backend o link que iria por e-mail.
      WEEDIARIO_MAIL_LOG_LINKS: ${WEEDIARIO_MAIL_LOG_LINKS:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      # Provedores na porta 465 (SSL direto, ex. Hostinger): true aqui e STARTTLS false.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      # Mesma origem via nginx; a lista só importa para quem acessar a API de outra origem.
      WEEDIARIO_CORS_ORIGINS: ${WEEDIARIO_PUBLIC_URL:-http://localhost:${WEEDIARIO_HTTP_PORT:-8080}}
      WEEDIARIO_MEDIA_PATH: /app/data/images
    volumes:
      - images:/app/data
    tmpfs:
      - /tmp
      # Só a libwebp (encoder WebP) é extraída aqui, e carregá-la exige exec. uid/gid = usuário da imagem.
      - /app/native:exec,mode=0700,uid=100,gid=101,size=8m

  frontend:
    <<: [*logging, *hardening]
    build: ./frontend
    image: weediario-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Só no loopback. Para expor na rede/internet, coloque um proxy com HTTPS na frente (Caddy, Traefik...).
      - "127.0.0.1:${WEEDIARIO_HTTP_PORT:-8080}:8080"
    tmpfs:
      - /tmp

  # HTTPS com certificado automático (Let's Encrypt) na frente do nginx:
  #   WEEDIARIO_DOMAIN=seu.dominio.com docker compose --profile https up -d
  # Com WEEDIARIO_DOMAIN=localhost, usa uma CA local do Caddy para testar na máquina.
  caddy:
    <<: *logging
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      WEEDIARIO_DOMAIN: ${WEEDIARIO_DOMAIN:-localhost}
    ports:
      - "${WEEDIARIO_HTTP_PUBLIC_PORT:-80}:80"
      - "${WEEDIARIO_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Banco acessível no host só quando pedido, para rodar o backend fora do Docker (mvn spring-boot:run):
  #   docker compose --profile dev up -d
  postgres-port:
    image: alpine/socat:1.8.0.3
    profiles: ["dev"]
    depends_on:
      postgres:
        condition: service_healthy
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
  images:
  caddy_data:
  caddy_config:
